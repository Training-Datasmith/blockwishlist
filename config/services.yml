services:
  # Controller
  Presta_Shop\Module\Block_Wish_List\Controller\Wishlist_Configuration_Admin_Controller:
    public: true
    class: Presta_Shop\Module\Block_Wish_List\Controller\Wishlist_Configuration_Admin_Controller
    arguments:
      - '@doctrine.cache.provider'
      - '@=service("prestashop.adapter.shop.context").getContextShopID()'

  # Calculator
  prestashop.module.blockwishlist.calculator.statistics_calculator:
    public: true
    class: Presta_Shop\Module\Block_Wish_List\Calculator\Statistics_Calculator
    arguments:
      - '@prestashop.adapter.legacy.context' #used for product presenter
      - '@=service("prestashop.core.localization.locale.repository").getLocale(service("prestashop.adapter.legacy.context").getContext().language.getLocale())' # From PS 1.7.7: "@prestashop.core.localization.locale.context_locale"

  # Grid Definition
  prestashop.module.blockwishlist.grid.all_time_statistics_grid_definition_factory:
    public: true
    class: 'Presta_Shop\Module\Block_Wish_List\Grid\Definition\All_Time_Statistics_Grid_Definition_Factory'
    parent: 'prestashop.core.grid.definition.factory.abstract_grid_definition'

  prestashop.module.blockwishlist.grid.current_year_statistics_grid_definition_factory:
    public: true
    class: 'Presta_Shop\Module\Block_Wish_List\Grid\Definition\Current_Year_Statistics_Grid_Definition_Factory'
    parent: 'prestashop.core.grid.definition.factory.abstract_grid_definition'

  prestashop.module.blockwishlist.grid.current_month_statistics_grid_definition_factory:
    public: true
    class: 'Presta_Shop\Module\Block_Wish_List\Grid\Definition\Current_Month_Statistics_Grid_Definition_Factory'
    parent: 'prestashop.core.grid.definition.factory.abstract_grid_definition'

  prestashop.module.blockwishlist.grid.current_day_statistics_grid_definition_factory:
    public: true
    class: 'Presta_Shop\Module\Block_Wish_List\Grid\Definition\Current_Day_Statistics_Grid_Definition_Factory'
    parent: 'prestashop.core.grid.definition.factory.abstract_grid_definition'

  # Grid Data Factories
  prestashop.module.blockwishlist.grid.all_time_statistics_data_factory:
    class: 'Presta_Shop\Module\Block_Wish_List\Grid\Data\All_Time_Statistics_Grid_Data_Factory'
    arguments:
        - '@doctrine.cache.provider'
        - '@prestashop.module.blockwishlist.calculator.statistics_calculator'
        - '@=service("prestashop.adapter.shop.context").getContextShopID()'

  prestashop.module.blockwishlist.grid.current_year_statistics_data_factory:
    class: 'Presta_Shop\Module\Block_Wish_List\Grid\Data\Current_Year_Statistics_Grid_Data_Factory'
    arguments:
        - '@doctrine.cache.provider'
        - '@prestashop.module.blockwishlist.calculator.statistics_calculator'
        - '@=service("prestashop.adapter.shop.context").getContextShopID()'

  prestashop.module.blockwishlist.grid.current_month_statistics_data_factory:
    class: 'Presta_Shop\Module\Block_Wish_List\Grid\Data\Current_Month_Statistics_Grid_Data_Factory'
    arguments:
        - '@doctrine.cache.provider'
        - '@prestashop.module.blockwishlist.calculator.statistics_calculator'
        - '@=service("prestashop.adapter.shop.context").getContextShopID()'

  prestashop.module.blockwishlist.grid.current_day_statistics_data_factory:
    class: 'Presta_Shop\Module\Block_Wish_List\Grid\Data\Current_Day_Statistics_Grid_Data_Factory'
    arguments:
        - '@doctrine.cache.provider'
        - '@prestashop.module.blockwishlist.calculator.statistics_calculator'
        - '@=service("prestashop.adapter.shop.context").getContextShopID()'

  # Grid Factories
  prestashop.module.blockwishlist.grid.all_time_stastistics_grid_factory:
    public: true
    class: 'Presta_Shop\Presta_Shop\Core\Grid\Grid_Factory'
    arguments:
        - '@prestashop.module.blockwishlist.grid.all_time_statistics_grid_definition_factory'
        - '@prestashop.module.blockwishlist.grid.all_time_statistics_data_factory'
        - '@prestashop.core.grid.filter.form_factory'
        - '@prestashop.core.hook.dispatcher'

  prestashop.module.blockwishlist.grid.current_year_stastistics_grid_factory:
    public: true
    class: 'Presta_Shop\Presta_Shop\Core\Grid\Grid_Factory'
    arguments:
        - '@prestashop.module.blockwishlist.grid.current_year_statistics_grid_definition_factory'
        - '@prestashop.module.blockwishlist.grid.current_year_statistics_data_factory'
        - '@prestashop.core.grid.filter.form_factory'
        - '@prestashop.core.hook.dispatcher'

  prestashop.module.blockwishlist.grid.current_month_stastistics_grid_factory:
    public: true
    class: 'Presta_Shop\Presta_Shop\Core\Grid\Grid_Factory'
    arguments:
        - '@prestashop.module.blockwishlist.grid.current_month_statistics_grid_definition_factory'
        - '@prestashop.module.blockwishlist.grid.current_month_statistics_data_factory'
        - '@prestashop.core.grid.filter.form_factory'
        - '@prestashop.core.hook.dispatcher'

  prestashop.module.blockwishlist.grid.current_day_stastistics_grid_factory:
    public: true
    class: 'Presta_Shop\Presta_Shop\Core\Grid\Grid_Factory'
    arguments:
        - '@prestashop.module.blockwishlist.grid.current_day_statistics_grid_definition_factory'
        - '@prestashop.module.blockwishlist.grid.current_day_statistics_data_factory'
        - '@prestashop.core.grid.filter.form_factory'
        - '@prestashop.core.hook.dispatcher'
